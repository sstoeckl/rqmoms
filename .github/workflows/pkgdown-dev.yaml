name: pkgdown-dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pkgdown-dev:
    runs-on: ubuntu-latest
    env:
      RQMOMS_BUILD_PY: "1"

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::reticulate
          needs: website

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install qmoms + numpy into toolcache Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy tqdm "git+https://github.com/vilkovgr/qmoms@main"

      - name: Build pkgdown site (dev, Python bound, same process)
        env:
          RQMOMS_BUILD_PY: "1"
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          Rscript -e 'reticulate::use_python(Sys.getenv("RETICULATE_PYTHON"), required=TRUE);
                      reticulate::py_run_string("import numpy as np; np.NAN = getattr(np, \"NAN\", np.nan)");
                      pkgdown::build_site(new_process=FALSE, install=FALSE,
                        override = list(url = "https://www.sebastianstoeckl.com/rqmoms/dev/"))'

      - name: Deploy to GitHub Pages (dev/ subfolder)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/dev
          target-folder: dev
          clean: false
